name: Atualizar Modpack Manifest

on:
  push:
    paths:
      - 'mods/**'

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Gerar Manifesto com Mods Reais
        run: |
          echo "{" > manifest.json
          echo '  "packId": "ToxFriendsPack",' >> manifest.json
          echo '  "version": "1.$(date +%s)",' >> manifest.json
          echo '  "minecraftVersion": "1.20.1",' >> manifest.json
          echo '  "loader": "Fabric",' >> manifest.json
          echo '  "loaderVersion": "0.14.21",' >> manifest.json
          echo '  "files": [' >> manifest.json

          first=true
          for file in mods/*.jar; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> manifest.json
              fi
              size=$(stat -c%s "$file")
              filename=$(basename "$file")
              echo "    {" >> manifest.json
              echo "      \"path\": \"mods/$filename\"," >> manifest.json
              echo "      \"url\": \"https://raw.githubusercontent.com/BG-0o/Minecraft/main/mods/$filename\"," >> manifest.json
              echo "      \"sha256\": \"\"," >> manifest.json
              echo "      \"size\": $size" >> manifest.json
              echo "    }" >> manifest.json
            fi
          done

          echo "  ]" >> manifest.json
          echo "}" >> manifest.json

      - name: Enviar manifest.json atualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática do manifesto com mods reais"
          file_pattern: "manifest.json"
